<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <title>{{title}}</title>
  <meta name="author" content="{{author}}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="resume.css">
  <style>
    /* Running footer, printed at the bottom-right of every page (front matter "footer"). */
    @page { @bottom-right { content: {{footer}}; } }
    .page-footer::after { content: {{footer}}; }
  </style>
</head>
<body>
  <main class="resume">
{{content}}
  </main>
  <div class="page-footer" aria-hidden="true"></div>
</body>
</html>
